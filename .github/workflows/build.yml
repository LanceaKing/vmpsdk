name: Build examples

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux GCC x86 + x64 and MinGW x86
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify imported files
        run: python3 ci/verify.py
      - name: Resolve compiler packages
        id: apt-packages
        run: |
          sudo apt-get update
          mkdir -p .build/apt-archives/partial
          apt-get --print-uris -y install g++-multilib g++-mingw-w64-i686 > .build/apt-plan.txt
          echo "digest=$(sha256sum .build/apt-plan.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache compiler package downloads
        uses: actions/cache@v6
        with:
          path: .build/apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-apt-v1-${{ steps.apt-packages.outputs.digest }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-apt-v1-
      - name: Install compilers
        run: |
          sudo apt-get -o Dir::Cache::archives="$PWD/.build/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true install -y g++-multilib g++-mingw-w64-i686
      - run: python3 ci/prepare.py
      - run: bash ci/build-unix.sh linux
      - name: Verify source and SDK bytes after building
        if: always()
        run: |
          python3 ci/verify.py
          python3 ci/verify.py --root .build/work --build-tree
      - name: Package executables with runtime libraries
        run: tar -czf .build/linux-mingw.tar.gz -C .build/artifacts .
      - uses: actions/upload-artifact@v7
        with:
          name: linux-mingw
          path: .build/linux-mingw.tar.gz
          if-no-files-found: error

  macos:
    name: macOS x64 / ${{ matrix.example }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    strategy:
      fail-fast: false
      matrix:
        example: [gcc, fpc, xcode-markers, xcode-licensing]
    steps:
      - uses: actions/checkout@v7
      - run: python3 ci/verify.py
      - name: Resolve Free Pascal package
        if: matrix.example == 'fpc'
        id: brew-fpc
        run: |
          echo "path=$(brew --cache)" >> "$GITHUB_OUTPUT"
          brew info --json=v2 fpc | python3 -c 'import json, sys; f = json.load(sys.stdin)["formulae"][0]; print("version=" + f["versions"]["stable"] + "-" + str(f["revision"]))' >> "$GITHUB_OUTPUT"
      - name: Cache Free Pascal download
        if: matrix.example == 'fpc'
        uses: actions/cache@v6
        with:
          path: ${{ steps.brew-fpc.outputs.path }}/downloads/*--fpc-*
          key: ${{ runner.os }}-${{ runner.arch }}-macos-15-intel-fpc-v1-${{ steps.brew-fpc.outputs.version }}
      - name: Install Free Pascal
        if: matrix.example == 'fpc'
        run: brew install fpc
      - run: python3 ci/prepare.py
      - run: bash ci/build-unix.sh '${{ matrix.example }}'
      - name: Verify source and SDK bytes after building
        if: always()
        run: |
          python3 ci/verify.py
          python3 ci/verify.py --root .build/work --build-tree
      - name: Preserve executable permissions in artifact
        run: tar -czf .build/macos-${{ matrix.example }}.tar.gz -C .build/artifacts .
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.example }}-x64
          path: .build/macos-${{ matrix.example }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows / ${{ matrix.kind }} / ${{ matrix.arch }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: native, arch: x86}
          - {kind: native, arch: x64}
          - {kind: masm, arch: x86}
          - {kind: vb6, arch: x86}
          - {kind: managed, arch: x86}
          - {kind: pascal, arch: x86}
    steps:
      - name: Enable real Git symlinks before checkout
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - run: python ci/verify.py
      - name: Cache MASM32 SDK download
        if: matrix.kind == 'masm'
        uses: actions/cache@v6
        with:
          path: .build/downloads/masm32/m32v9r.zip
          key: ${{ runner.os }}-${{ runner.arch }}-masm32-v9-${{ hashFiles('ci/install-masm32.ps1') }}
      - name: Prepare MASM32 SDK without the GUI installer
        if: matrix.kind == 'masm'
        run: ./ci/install-masm32.ps1
      - name: Cache .NET reference assemblies
        if: matrix.kind == 'managed'
        uses: actions/cache@v6
        with:
          path: .build/packages
          key: ${{ runner.os }}-${{ runner.arch }}-windows-2022-net-reference-assemblies-v1-${{ hashFiles('ci/build-windows.ps1') }}
      - name: Cache VB6 toolchain download
        if: matrix.kind == 'vb6'
        uses: actions/cache@v6
        with:
          path: |
            .build/downloads/vb6/vb6-portable.zip
            .build/downloads/vb6/VB60SP6-KB2708437-x86-ENU.msi
          key: ${{ runner.os }}-${{ runner.arch }}-windows-2022-vb6-${{ hashFiles('ci/install-vb6.ps1') }}
      - name: Prepare VB6 compiler
        if: matrix.kind == 'vb6'
        run: ./ci/install-vb6.ps1
      - name: Cache Lazarus and Free Pascal toolchain
        if: matrix.kind == 'pascal'
        id: lazarus-cache
        uses: actions/cache@v6
        with:
          path: C:\lazarus
          key: ${{ runner.os }}-${{ runner.arch }}-windows-2022-lazarus-4.0-fpc-3.2.2-win32-v1
      - name: Install Lazarus and Free Pascal
        if: matrix.kind == 'pascal' && steps.lazarus-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = 'https://download.lazarus-ide.org/Lazarus%20Windows%2032%20bits/Lazarus%204.0/lazarus-4.0-fpc-3.2.2-win32.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-installer.exe'
          Invoke-WebRequest $url -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\lazarus' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Lazarus installer exited with $($process.ExitCode)" }
      - run: python ci/prepare.py
      - run: ./ci/build-windows.ps1 -Kind '${{ matrix.kind }}' -Arch '${{ matrix.arch }}'
      - name: Verify source and SDK bytes after building
        if: always()
        run: |
          python ci/verify.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ci/verify.py --root .build/work --build-tree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.kind }}-${{ matrix.arch }}
          path: .build/artifacts/
          if-no-files-found: error
